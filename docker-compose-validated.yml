        volume: {}
  frontend:
    build:
      context: c:\Users\Mac\OneDrive\Desktop\Projects\PDFCraft.Pro
      dockerfile: Dockerfile.frontend
    container_name: pdflab-frontend
    depends_on:
      backend:
        condition: service_started
        required: true
    environment:
      NODE_ENV: production
      SKIP_ENV_VALIDATION: "false"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'require(''http'').get(''http://localhost:3000'', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})'
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 40s
    networks:
      pdflab-network: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
  mysql:
    command:
      - --default-authentication-plugin=mysql_native_password
    container_name: pdflab-mysql
    environment:
      MYSQL_DATABASE: pdflab_db
      MYSQL_PASSWORD: pdflab_db_pass_2025_secure
      MYSQL_ROOT_PASSWORD: pdflab_root_pass_2025_secure
      MYSQL_USER: pdflab_user
    expose:
      - "3306"
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -ppdflab_root_pass_2025_secure
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 40s
    image: mysql:8.0
    networks:
      pdflab-network: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: mysql_data
        target: /var/lib/mysql
        volume: {}
      - type: bind
        source: c:\Users\Mac\OneDrive\Desktop\Projects\PDFCraft.Pro\mysql\init
        target: /docker-entrypoint-initdb.d
        bind:
          create_host_path: true
  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
    container_name: pdflab-redis
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 10s
      interval: 30s
      retries: 3
    image: redis:7-alpine
    networks:
      pdflab-network: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: redis_data
        target: /data
        volume: {}
networks:
  pdflab-network:
    name: pdfcraftpro_pdflab-network
    driver: bridge
volumes:
  logs:
    name: pdfcraftpro_logs
    driver: local
  mysql_data:
    name: pdfcraftpro_mysql_data
    driver: local
  redis_data:
    name: pdfcraftpro_redis_data
    driver: local
  temp:
    name: pdfcraftpro_temp
    driver: local
  uploads:
    name: pdfcraftpro_uploads
    driver: local
