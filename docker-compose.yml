version: '3.8'

services:
  # PDFCraft.Pro Application
  pdfcraft-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdfcraft-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=mysql://pdfcraft_user:${MYSQL_PASSWORD}@mysql:3306/pdfcraft_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=104857600
      - LIBREOFFICE_AVAILABLE=true
      - GHOSTSCRIPT_AVAILABLE=true
    volumes:
      - uploads:/app/uploads
      - temp:/app/temp
      - logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - pdfcraft-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: pdfcraft-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=pdfcraft_db
      - MYSQL_USER=pdfcraft_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - pdfcraft-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for Queue Management
  redis:
    image: redis:7-alpine
    container_name: pdfcraft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pdfcraft-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: pdfcraft-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/ssl/certs
      - logs:/var/log/nginx
    depends_on:
      - pdfcraft-app
    networks:
      - pdfcraft-network
    profiles:
      - production

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local
  temp:
    driver: local
  logs:
    driver: local

networks:
  pdfcraft-network:
    driver: bridge