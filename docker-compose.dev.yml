version: '3.8'

services:
  # Development Database (MySQL)
  mysql-dev:
    image: mysql:8.0
    container_name: pdflab-mysql-dev
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=devpassword
      - MYSQL_DATABASE=pdflab_dev
      - MYSQL_USER=pdflab_dev
      - MYSQL_PASSWORD=devpassword
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - pdflab-dev-network
    command: --default-authentication-plugin=mysql_native_password

  # Development Redis
  redis-dev:
    image: redis:7-alpine
    container_name: pdflab-redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - pdflab-dev-network

  # Development Application (for testing Docker build)
  pdflab-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pdflab-app-dev
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=mysql://pdflab_dev:devpassword@mysql-dev:3306/pdflab_dev
      - REDIS_URL=redis://redis-dev:6379
      - JWT_SECRET=development_jwt_secret_not_for_production
      - PAYSTACK_SECRET_KEY=sk_test_your_test_key
      - PAYSTACK_PUBLIC_KEY=pk_test_your_test_key
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - /app/backend/node_modules
    depends_on:
      - mysql-dev
      - redis-dev
    networks:
      - pdflab-dev-network

volumes:
  mysql_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  pdflab-dev-network:
    driver: bridge