<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pdflab.pro - New Interface Mockup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1c;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Circuit board background pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(0, 255, 255, 0.05) 0%, transparent 50%);
            background-size: 100px 100px, 200px 200px, 150px 150px;
        }

        /* Circuit lines */
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(0deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            position: relative;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #00ffff;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav a {
            color: #ffffff;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .nav a:hover {
            opacity: 1;
        }

        .signup-btn {
            background: linear-gradient(135deg, #00ffff, #0080ff);
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
        }

        .main-content {
            position: relative;
            z-index: 5;
            padding: 4rem 2rem;
            text-align: center;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .hero-subtitle {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00ffff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .hero-description {
            color: #a0a0a0;
            font-size: 1.1rem;
            margin-bottom: 4rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* NEW INTERFACE DESIGN */
        .conversion-interface {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 2rem;
            align-items: stretch;
            justify-content: center;
        }

        /* Tab Section */
        .tab-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 180px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.1);
        }

        .tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
        }

        .tab:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: rgba(0, 255, 255, 0.3);
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(0, 128, 255, 0.2));
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            color: #00ffff;
        }

        /* Upload Section */
        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 2px dashed rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 3rem 2rem;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.1);
        }

        .upload-section:hover {
            border-color: rgba(0, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .upload-icon {
            font-size: 3rem;
            color: #00ffff;
            margin-bottom: 1rem;
        }

        .upload-text {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .upload-subtext {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        /* Output Section */
        .output-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            min-width: 200px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.1);
        }

        .output-label {
            color: #ffffff;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-align: center;
            opacity: 0.8;
        }

        .dropdown {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            padding: 1rem;
            color: #ffffff;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2300ffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        .dropdown:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(0, 255, 255, 0.5);
        }

        .dropdown:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Process Button */
        .process-button {
            margin-top: 3rem;
            background: linear-gradient(135deg, #00ffff, #0080ff);
            color: #000;
            border: none;
            padding: 1rem 3rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.3);
        }

        .process-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.4);
        }

        /* Customer Feedback Section */
        .feedback-section {
            margin-top: 6rem;
            color: #00ffff;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* State Variations */
        .merge-state .upload-text {
            color: #ffffff;
        }

        .merge-state .upload-subtext {
            color: #a0a0a0;
        }

        .disabled-state {
            opacity: 0.4;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .conversion-interface {
                flex-direction: column;
                gap: 1.5rem;
            }

            .hero-title, .hero-subtitle {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            🏢 PDF Lab Pro
        </div>
        <div class="nav">
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">Sign In</a>
            <a href="#" class="signup-btn">Sign up</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="hero-title">Convert & Merge PDFs</h1>
        <h2 class="hero-subtitle">instantly</h2>
        <p class="hero-description">
            Fast, secure PDF processing. Convert to PowerPoint, merge multiple PDFs, or export to images.
        </p>

        <!-- NEW INTERFACE -->
        <div class="conversion-interface" id="interface">
            <!-- Tab Section -->
            <div class="tab-section">
                <div class="tab active" onclick="setMode('convert')">
                    Convert
                </div>
                <div class="tab" onclick="setMode('merge')">
                    Merge
                </div>
            </div>

            <!-- Upload Section -->
            <div class="upload-section">
                <div class="upload-icon">📁</div>
                <div class="upload-text" id="uploadText">Drop your PDF here</div>
                <div class="upload-subtext" id="uploadSubtext">Or click to browse files</div>
            </div>

            <!-- Output Section -->
            <div class="output-section">
                <div class="output-label">Output Format</div>
                <select class="dropdown" id="outputDropdown">
                    <option value="image">📷 Image</option>
                    <option value="powerpoint">📊 PowerPoint</option>
                    <option value="word">📝 Word</option>
                    <option value="excel">📈 Excel</option>
                </select>
            </div>
        </div>

        <button class="process-button" onclick="processFiles()">
            Start Processing
        </button>

        <div class="feedback-section">
            CUSTOMER FEEDBACK
        </div>
    </div>

    <script>
        function setMode(mode) {
            const tabs = document.querySelectorAll('.tab');
            const uploadText = document.getElementById('uploadText');
            const uploadSubtext = document.getElementById('uploadSubtext');
            const dropdown = document.getElementById('outputDropdown');
            const interface = document.getElementById('interface');

            // Reset all tabs
            tabs.forEach(tab => tab.classList.remove('active'));

            if (mode === 'convert') {
                tabs[0].classList.add('active');
                uploadText.textContent = 'Drop your PDF here';
                uploadSubtext.textContent = 'Or click to browse files';
                dropdown.disabled = false;
                interface.classList.remove('merge-state');
            } else {
                tabs[1].classList.add('active');
                uploadText.textContent = 'Drop multiple PDFs here';
                uploadSubtext.textContent = 'Select 2 or more PDF files to merge';
                dropdown.disabled = true;
                interface.classList.add('merge-state');
            }
        }

        function processFiles() {
            alert('Processing would start here!');
        }

        // Initialize in convert mode
        setMode('convert');
    </script>
</body>
</html>
